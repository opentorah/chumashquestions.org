plugins {
  id 'scala'
  id 'org.podval.conventions'
  id 'org.podval.tools.scalajs' version '2.2.0'
  id 'org.podval.tools.site-publisher' version '0.4.0'
}

// Gradle 9.8.1 still defaults Zinc to 1.12.0.
scala.zincVersion = '1.12.1'

description = 'The Chumash Questions'

// There is no Java in the project.
project.gradle.startParameter.excludedTaskNames.add('compileJava')

dependencies {
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

site {
  treatErrorsAsWarnings = true
  production = true
}

// JDK 22+ compatibility flags for tests (not site-publisher):
// scala.runtime.LazyVals$ (old lazy-val bytecode on the classpath) uses sun.misc.Unsafe
ext.jdkCompatJvmArgs = [
  '--enable-native-access=ALL-UNNAMED',
  '--sun-misc-unsafe-memory-access=allow',
]

tasks.withType(JavaExec).configureEach {
  jvmArgs jdkCompatJvmArgs
}

tasks.withType(Test).configureEach {
  workingDir = project.projectDir
  jvmArgs jdkCompatJvmArgs
}
