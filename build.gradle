plugins {
  id 'scala'
  id 'org.podval.conventions'
  id 'org.podval.tools.scalajs' version '2.3.0'
  id 'org.podval.tools.site-publisher' version '0.8.0'
}

description = 'The Chumash Questions'

// There is no Java in the project.
project.gradle.startParameter.excludedTaskNames.add('compileJava')

dependencies {
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

site {
  treatErrorsAsWarnings = true
  production = true
}

// scala.runtime.LazyVals$ uses sun.misc.Unsafe
podval.allowJdk25RestrictedAccess()

tasks.withType(Test).configureEach {
  workingDir = project.projectDir
}
